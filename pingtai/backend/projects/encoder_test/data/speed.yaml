# ASDB2速度控制测试数据
speed_cases:
  # 低速测试
  - case_id: "speed_p1_09_10_cw"
    description: "P1-09低速测试 - 10RPM 顺时针"
    source: "P1-09"
    rpm: 10
    direction: "CW"
    tolerance: 2.0
    settle_time: 3.0
    
  - case_id: "speed_p1_09_10_ccw"
